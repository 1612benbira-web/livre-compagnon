name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - name: Tests serveur (unitaires + intégration MongoDB)
        run: npm test
        working-directory: server
        env:
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/livre_compagnon_test
      - name: Tests client (rendu des pages + schémas)
        run: npm run test:smoke
        working-directory: client
      - name: Build du frontend
        run: npm run build
        working-directory: client
      - name: Audit des dépendances (vulnérabilités élevées)
        run: |
          npm audit --audit-level=high --omit=dev --prefix server
          npm audit --audit-level=high --omit=dev --prefix client
